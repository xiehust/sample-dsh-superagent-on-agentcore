[project]
name = "dshsa-worker"
version = "0.1.0"
description = "AgentCore worker for the dshsa super agent: container gateway/agent, broker, provisioner and worker-api Lambdas"
requires-python = ">=3.12"
dependencies = ["boto3>=1.40", "cryptography>=44"]

[project.optional-dependencies]
container = ["aiohttp>=3.10", "claude-agent-sdk==0.2.176"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "aiohttp>=3.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dshsa_worker"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "container", "../packages/contracts/python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
